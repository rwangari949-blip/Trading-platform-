<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeFlow</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#07111d;
color:white
}
.auth{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.box{
width:100%;
max-width:400px;
background:#0d1c2b;
padding:30px;
border-radius:15px
}
.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#22c55e;
margin-bottom:20px
}
input,select{
width:100%;
padding:13px;
margin:7px 0;
border-radius:8px;
border:1px solid #294052;
background:#07131f;
color:white
}
button{
width:100%;
padding:13px;
margin-top:8px;
border:0;
border-radius:8px;
font-weight:bold;
cursor:pointer
}
.green{background:#22c55e;color:#061009}
.dark{background:#172b3d;color:white}
.app{display:none}
.sidebar{
background:#091724;
padding:15px
}
.brand{
font-size:24px;
font-weight:bold;
color:#22c55e;
margin-bottom:15px
}
.nav{
display:flex;
gap:5px;
flex-wrap:wrap
}
.nav button{
width:auto;
background:#172b3d;
color:white;
padding:10px 13px
}
.main{padding:20px}
.page{display:none}
.page.active{display:block}
.cards{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}
.card{
background:#0d1c2b;
padding:18px;
border-radius:12px
}
.label{
color:#91a4b5;
font-size:13px
}
.value{
font-size:23px;
font-weight:bold;
margin-top:7px
}
.section{
background:#0d1c2b;
padding:18px;
border-radius:12px;
margin-top:15px
}
.market{
display:flex;
justify-content:space-between;
padding:14px;
background:#071724;
margin:7px 0;
border-radius:8px
}
#chart{
width:100%;
height:300px;
background:#07131f;
border-radius:10px
}
.trade-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.buy{background:#22c55e}
.sell{background:#ef4444;color:white}
table{
width:100%;
border-collapse:collapse
}
td,th{
padding:10px;
border-bottom:1px solid #203444;
text-align:left
}
@media(max-width:600px){
.main{padding:12px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="auth" id="auth">
<div class="box">

<div class="logo">TradeFlow</div>

<div id="login">

<input id="loginEmail" type="email" placeholder="Email">

<input id="loginPassword" type="password" placeholder="Password">

<button class="green" onclick="login()">Login</button>

<button class="dark" onclick="showCreate()">Create Account</button>

</div>

<div id="create" style="display:none">

<input id="name" placeholder="Full name">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button class="green" onclick="createAccount()">Create Account</button>

<button class="dark" onclick="showLogin()">Back to Login</button>

</div>

</div>
</div>


<!-- APP -->
<div class="app" id="app">

<div class="sidebar">

<div class="brand">TradeFlow</div>

<div class="nav">

<button onclick="openPage('dashboard')">Dashboard</button>

<button onclick="openPage('trade')">Trade</button>

<button onclick="openPage('positions')">Positions</button>

<button onclick="openPage('history')">History</button>

<button onclick="openPage('wallet')">Wallet</button>

<button onclick="openPage('profile')">Profile</button>

<button onclick="logout()">Logout</button>

</div>

</div>


<div class="main">

<!--
