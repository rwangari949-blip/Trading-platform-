<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeFlow</title>
<style>
body{margin:0;font-family:Arial;background:#0b1120;color:white}
header{padding:20px;background:#111827;font-size:24px;font-weight:bold;text-align:center}
.hero{text-align:center;padding:50px 20px}
button{padding:14px 24px;border:0;border-radius:8px;background:#2563eb;color:white;font-size:17px;margin:5px}
.card,.balance,.history{background:#111827;margin:15px auto;padding:20px;max-width:400px;border-radius:12px}
#dashboard{display:none;text-align:center;padding:35px 20px}
input{padding:14px;margin:8px;border-radius:6px;border:0;width:80%;max-width:300px}
#message{margin:15px;font-weight:bold}
.price{font-size:24px;font-weight:bold}
</style>
</head>

<body>

<header>TradeFlow</header>

<div id="home">
<div class="hero">
<h1>Trade Smarter. Trade Better.</h1>
<p>Explore markets and practice trading with TradeFlow.</p>
<button onclick="startTrading()">Start Trading</button>
</div>

<div style="text-align:center">
<h2>Markets</h2>

<div class="card">
<h3>Bitcoin (BTC)</h3>
<div class="price" id="btc">$67,500</div>
</div>

<div class="card">
<h3>Ethereum (ETH)</h3>
<div class="price" id="eth">$3,500</div>
</div>

<div class="card">
<h3>Gold</h3>
<div class="price" id="gold">$2,650</div>
</div>

<div class="card">
<h3>USD</h3>
<div class="price" id="usd">1.00</div>
</div>

</div>
</div>

<div id="dashboard">

<h1>Trading Dashboard</h1>
<p>Welcome to TradeFlow</p>

<div class="balance">
<h2>Available Balance</h2>
<h1>$10,000</h1>
</div>

<input id="amount" type="number" placeholder="Enter amount">

<br>

<button onclick="buy()">Buy</button>
<button onclick="sell()">Sell</button>

<div id="message"></div>

<div class="history">
<h2>Trade History</h2>
<p id="historyText">No trades yet.</p>
</div>

<br>

<button onclick="goHome()">Back to Home</button>

</div>

<script>

function startTrading(){
document.getElementById("home").style.display="none";
document.getElementById("dashboard").style.display="block";
}

function goHome(){
document.getElementById("dashboard").style.display="none";
document.getElementById("home").style.display="block";
}

function buy(){
let amount=document.getElementById("amount").value;
if(amount==="" || amount<=0){
document.getElementById("message").innerText="Please enter an amount.";
return;
}
document.getElementById("message").innerText="Demo Buy order placed: $" + amount;
document.getElementById("historyText").innerText="Bought $" + amount;
}

function sell(){
let amount=document.getElementById("amount").value;
if(amount==="" || amount<=0){
document.getElementById("message").innerText="Please enter an amount.";
return;
}
document.getElementById("message").innerText="Demo Sell order placed: $" + amount;
document.getElementById("historyText").innerText="Sold $" + amount;
}

function changePrices(){
let btc=67500 + Math.floor(Math.random()*1000-500);
let eth=3500 + Math.floor(Math.random()*100-50);
let gold=2650 + Math.floor(Math.random()*40-20);

document.getElementById("btc").innerText="$"+btc.toLocaleString();
document.getElementById("eth").innerText="$"+eth.toLocaleString();
document.getElementById("gold").innerText="$"+gold.toLocaleString();
}

setInterval(changePrices,3000);

</script>

</body>
</html>
