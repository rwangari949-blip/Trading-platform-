<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFlow</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #263247;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .btn {
      background: #19c37d;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      padding: 70px 25px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #aab4c5;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .markets {
      padding: 30px 20px;
      max-width: 900px;
      margin: auto;
    }

    .market {
      background: #121c2e;
      padding: 20px;
      margin: 12px 0;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
    }

    .price {
      color: #19c37d;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #77849a;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">TradeFlow</div>
    <a href="#" class="btn">Get Started</a>
  </header>

  <section class="hero">
    <h1>Trade Smarter. Trade Better.</h1>
    <p>
      A modern trading platform designed to help you monitor markets,
      manage your portfolio and practice trading.
    </p>
    <a href="#" class="btn">Start Trading</a>
  </section>

  <section class="markets">
    <h2>Markets</h2>

    <div class="market">
      <span>Bitcoin (BTC)</span>
      <span class="price">$67,420</span>
    </div>

    <div class="market">
      <span>Ethereum (ETH)</span>
      <span class="price">$2,580</span>
    </div>

    <div class="market">
      <span>EUR/USD</span>
      <span class="price">1.1742</span>
    </div>

    <div class="market">
      <span>Gold</span>
      <span class="price">$3,745</span>
    </div>
  </section>

  <footer>
    © 2026 TradeFlow. Demo trading platform.
  </footer>

</body>
</html>
